name: Build Android VM APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Debug APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle :app:assembleDebug

      - name: Upload Internal Artifact Backup
        uses: actions/upload-artifact@v4
        with:
          name: Android-VM-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Release & Attach Raw APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Android-VM v1.0.0-build.${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
          body: |
            Automated debug build compiled via GitHub Actions.
            - **Gradle:** 8.5
            - **AGP:** 8.2.2
            - **Target SDK:** 34
